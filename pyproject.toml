[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omf"
version = "0.1.1"
description = "OMF — Open Meeting Format: additive OKF v0.2 profile for meeting occurrence packs"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
omf-validate = "omf.validate:main"

[project.urls]
Homepage = "https://github.com/eidos-agi/omf"
Repository = "https://github.com/eidos-agi/omf"
Spec = "https://github.com/eidos-agi/omf/blob/main/SPEC.md"

[tool.setuptools.packages.find]
include = ["omf*"]
